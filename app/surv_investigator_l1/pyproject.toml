[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surv_investigator_l1"
version = "0.1.0"
description = "Level-1 spoofing/layering alert investigator on Amazon Bedrock AgentCore Runtime"
requires-python = ">=3.14,<3.15"
dependencies = [
    "bedrock-agentcore[strands-agents] >= 1.25.3, < 2.0.0",
    "strands-agents >= 1.63.0, < 2.0.0",
    "aws-opentelemetry-distro ~= 0.22.0",
    "pydantic >= 2.14, < 3",
    "boto3 >= 1.43, < 2",
]

[tool.agentcore]
entrypoint = "main.py"

[tool.hatch.build.targets.wheel]
packages = ["."]
