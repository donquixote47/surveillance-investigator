[project]
name = "surv-investigator"
version = "0.1.0"
description = "Trade surveillance alert investigator on Amazon Bedrock AgentCore (TFC project)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Agent
    "strands-agents>=1.0",
    "strands-agents-tools>=0.2",
    "bedrock-agentcore>=0.1",
    # AWS
    "boto3>=1.40",
    # Data: simulator, detector, discriminators, evaluation harness
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "pydantic>=2.8",
]

[dependency-groups]
infra = [
    "aws-cdk-lib>=2.219",
    "constructs>=10.4",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "pandas-stubs",
    "boto3-stubs[bedrock-agentcore,bedrock-agentcore-control,bedrock-runtime,dynamodb,lambda,s3,cognito-idp]",
    "moto[dynamodb]>=5.2.5",
]
ui = [
    "streamlit>=1.66.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_sim", "src/detector", "src/tools", "src/agent"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "evals", "scripts"]
# Kiro hook scripts carry long human-readable messages; they are tooling, not project code.
extend-exclude = [".kiro", "infra/build", "infra/cdk.out", "agentcore/cdk", "agentcore/.cache", "agentcore/.cli", "app/*/.venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E501"]
"scripts/*" = ["E501"]
"app/*/prompt.py" = ["E501"]  # prose for the model, kept as sentences

[tool.pytest.ini_options]
testpaths = ["src", "evals", "app", "ui"]
addopts = "-q"

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
